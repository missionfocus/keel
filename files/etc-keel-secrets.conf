# /etc/keel/secrets.conf -- what to fetch, never the secrets themselves.
#
# Every value below is an `op://vault/item/field` REFERENCE resolved at run time
# through the exe.dev 1Password Connect integration (keel-secret). The Connect
# token is injected at the network edge, so this VM can use the integration but
# can never read the credential, and nothing is written to disk.
#
# The VM must carry a tag the `onepassword` integration is attached to (dev or
# prod) or these lookups fail -- loudly, by design.
#
# This file is shipped in the image. Edit it here only to point at a different
# vault; the item names are the contract.

# The shared fleet repository. Deliberately NOT the cluster's ./borg: that one
# holds Postgres dumps that dedup against nothing here, and its README already
# documents lock-contention scheduling that more writers would destabilise.
BORG_REPO="ssh://de4596@de4596.rsync.net/./borg-fleet"
BORG_REMOTE_PATH="borg14"

# Passphrase for the shared repository.
KEEL_REF_PASSPHRASE="op://keel/borg-fleet/passphrase"

# The APPEND-ONLY rsync.net key. This VM can create archives and cannot delete
# them; the full-access key lives only on the steward. See the README.
KEEL_REF_SSH_KEY="op://keel/borg-fleet/private key"

# Optional dead-man's switch. Comment out to disable pings entirely.
KEEL_REF_HEALTHCHECKS="op://keel/borg-fleet/healthchecks-url"
